<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free AI Creator Toolkit</title>
<style>
body{margin:0;background:#24070f;color:white;font-family:Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:28px 18px}.hero{text-align:center}.badge{background:#f6dfc9;color:#24070f;padding:7px 12px;border-radius:30px;font-size:12px;font-weight:bold}h1{font-size:36px}.sub{color:#ead9d1}.card{background:white;color:#24151a;border-radius:20px;padding:20px;margin-top:20px}label{display:block;font-weight:bold;margin:12px 0 7px}input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;font-size:15px;box-sizing:border-box}button{width:100%;padding:14px;margin-top:15px;border:0;border-radius:12px;background:#7e2439;color:white;font-weight:bold;font-size:15px}.result{display:none;margin-top:18px;background:#faf7f5;padding:16px;border-radius:14px;white-space:pre-wrap;line-height:1.55}.secondary{background:#eee;color:#24151a}.small{font-size:12px;color:#76686a}</style></head>
<body><div class="wrap"><div class="hero"><span class="badge">100% FREE • NO SIGN-UP</span><h1>AI Creator Toolkit ✨</h1><p class="sub">Get ready-to-use content ideas, hooks, scripts and captions in seconds.</p></div>
<div class="card"><label>What do you want?</label><select id="type"><option value="ideas">10 Reel Ideas</option><option value="hooks">10 Hooks</option><option value="script">30-Second Reel Script</option><option value="captions">5 Captions</option><option value="calendar">7-Day Content Plan</option></select>
<label>Your niche</label><input id="niche" placeholder="e.g. digital marketing, beauty, fitness"><label>Your audience</label><input id="audience" placeholder="e.g. beginners, students"><label>Topic</label><input id="topic" placeholder="e.g. Instagram growth"><button onclick="generate()">✨ Generate My Content</button><div id="result" class="result"></div><button class="secondary" id="copy" onclick="copyResult()" style="display:none">Copy Result</button><p class="small">Tip: Be specific with your niche and audience.</p></div>
<div class="card"><b>What's inside?</b><p>💡 Reel Ideas &nbsp; 🪝 Hooks &nbsp; 🎬 Scripts &nbsp; ✍️ Captions &nbsp; 📅 Content Plans</p></div></div>
<script>
const fill=(s,n,a,t)=>s.replaceAll("{niche}",n).replaceAll("{audience}",a).replaceAll("{topic}",t);
const ideas=["3 mistakes beginners make in {topic}","The truth about {topic} nobody explains","3 quick tips to improve {topic}","What I wish I knew before starting {niche}","Beginner's guide to {topic}","Do this instead of random posting","3 tools that make {topic} easier","One simple change that can improve {topic}","Things I would stop doing as a {niche} beginner","Save this checklist for your next {topic} post"];
const hooks=["Stop scrolling if you're a {audience} trying to improve {topic}.","Nobody explained {topic} to me like this.","If you're just starting with {niche}, watch this.","You're probably making this mistake with {topic}.","Before you post about {topic}, do this.","Here's the simple version of {topic}.","I wish someone told me this when I started {niche}.","Don't make your next {topic} post before checking this.","If {topic} feels confusing, start here.","3 things I'd do first if I were learning {topic}."];
const captions=["Trying to improve {topic}? Start with the basics and focus on one thing at a time.","Save this if you're a {audience} learning {niche}.","Small improvements in {topic} can make a big difference.","Beginner reminder: you don't need to know everything about {topic} to start.","Send this to someone who is learning {topic}."];
function generate(){let n=document.getElementById('niche').value||"your niche",a=document.getElementById('audience').value||"beginners",t=document.getElementById('topic').value||"content creation",type=document.getElementById('type').value,out="";
if(type=="ideas")out=ideas.map((x,i)=>`${i+1}. ${fill(x,n,a,t)}`).join("\n");
if(type=="hooks")out=hooks.map((x,i)=>`${i+1}. ${fill(x,n,a,t)}`).join("\n");
if(type=="captions")out=captions.map((x,i)=>`${i+1}. ${fill(x,n,a,t)}`).join("\n");
if(type=="script")out=`HOOK\n${fill(hooks[0],n,a,t)}\n\nVALUE\nExplain the problem, then give 3 practical tips about ${t}. Show a real example and keep each point short.\n\nCTA\nSave this if you're learning ${t}, and follow for more beginner-friendly tips.`;
if(type=="calendar")out=`DAY 1 — ${fill(ideas[0],n,a,t)}\nDAY 2 — ${fill(hooks[2],n,a,t)}\nDAY 3 — Tutorial: one step-by-step tip about ${t}.\nDAY 4 — Relatable: a beginner mistake in ${n}.\nDAY 5 — List: 3 useful tools for ${t}.\nDAY 6 — Story: what you learned while starting ${n}.\nDAY 7 — Q&A: answer a common ${a} question about ${t}.`;
document.getElementById('result').style.display="block";document.getElementById('result').textContent=out;document.getElementById('copy').style.display="block";}
function copyResult(){navigator.clipboard.writeText(document.getElementById('result').textContent);document.getElementById('copy').textContent="✓ Copied!";setTimeout(()=>document.getElementById('copy').textContent="Copy Result",1200)}
</script></body></html>
